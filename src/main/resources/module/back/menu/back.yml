# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 标题
title: "<#0F766E>位置记录"

# 格子
slots:
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "LLLLLLLLL"
  - "PXXXXXXXN"

# 格子字符
keys:
  location: "L"

# 物品
items:
  location:
    by: "Vanilla"
    type: "red_bed"
    name: "<#67E8F9>{year}/{month}/{day} {hour}:{minute}:{second}"
    lore:
      - "<dark_gray>· <gray>类型 <white>{type}"
      - "<dark_gray>· <gray>服务器 <white>{server}"
      - "<dark_gray>· <gray>世界 <white>{world}"
      - "<dark_gray>· <gray>X <white>{x}"
      - "<dark_gray>· <gray>Y <white>{y}"
      - "<dark_gray>· <gray>Z <white>{z}"
      - "<dark_gray>· <gray>Yaw <white>{yaw}"
      - "<dark_gray>· <gray>Pitch <white>{pitch}"
      - ""
      - "<#67E8F9>» 点击传送"
  X:
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: "<white> </white>"
  P_1:
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: "<white> </white>"
  P_2:
    by: "Vanilla"
    type: "red_stained_glass_pane"
    name: "<#67E8F9>« 上一页"
  N_1:
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: "<white> </white>"
  N_2:
    by: "Vanilla"
    type: "lime_stained_glass_pane"
