# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 聊天模块总开关
enable: true

# 聊天延迟
# 绕过权限: mutool.bypass.chat.delay
delay:
  # 开关
  enable: true
  # 延迟(秒)
  delay: 3

# 禁止刷屏
# 绕过权限: mutool.bypass.chat.spam
spam:
  # 开关
  enable: true

# 私聊
msg:
  # 开关
  enable: true
  # 私聊命令
  commands:
    - "msg"
    - "w"
    - "tell"
  # 回复命令
  reply_commands:
    - "reply"
    - "r"

# @ 提及
at:
  # 开关
  enable: true
  # 匹配正则 @{at}
  pattern_format: "@?{at}"
  # 全体消息的关键词
  # 全体消息权限: mutool.chat.all
  all_message:
    - "all"

# 聊天格式(按分组, MiniMessage)
# 聊天颜色权限: mutool.chat.color
# 聊天 MiniMessage 格式权限: mutool.chat.minimessage
# 拥有 mutool.group.chatformat.<名字> 权限即可使用对应分组, 例如 mutool.group.chatformat.admin
format:
  # 开关
  enable: true
  # 默认分组
  default:
    # 权重(越高越优先)
    weight: 0
    # 格式
    format: "<white>{player}<white>: {message}"
  # admin 分组(需权限 mutool.group.chatformat.admin)
  admin:
    # 权重
    weight: 1
    # 格式
    format: "<#60A5FA>[管理] <white>{player}<white>: {message}"
