# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 事件操作
#
# 开关
enable: true
# 操作列表
list:
  # 自定义命名(仅用于日志/排错)
  player_join:
    # 事件(支持的事件类型，填写下列中文名之一)
    # =========================================
    # 玩家加入服务器      PlayerJoinEvent
    # 玩家退出服务器      PlayerQuitEvent
    # 玩家切换世界        PlayerChangedWorldEvent
    # 玩家聊天            AsyncPlayerChatEvent
    # 玩家死亡            PlayerDeathEvent
    # 玩家复活            PlayerRespawnEvent
    # 玩家移动            PlayerMoveEvent
    # 玩家传送            PlayerTeleportEvent
    # 玩家破坏方块        BlockBreakEvent
    # 玩家放置方块        BlockPlaceEvent
    # =========================================
    event: "玩家加入服务器"
    # 操作块列表(每个元素为“条件 + 操作”，条件缺省/为空表示无条件执行)
    actions:
      - # 无条件块：直接执行操作
        actions:
          - # 类型(开头带*为必填参数, []内为默认值)
            # player_command      玩家身份执行命令(*command, op[false], as_console[false])
            # console_command     后台身份执行命令(*command)
            # message             发送消息(*message)
            # broadcast           发送全体消息(*message)
            # title               发送标题消息(title[""], subtitle[""], in[20], step[70], out[10])
            # action_bar          发送操作栏消息(*message)
            # sound               发送音效(*sound, volume[1.0], pitch[1.0])
            # chat                以玩家身份发送消息(*message)
            # close               关闭当前界面
            # delay               延迟(*ticks[20]，可嵌套 actions)
            type: "message"
            message: "<#67E8F9>欢迎加入服务器"
      - # 带条件块：仅当 conditions 全部满足时才执行 actions
        conditions:
          - # 类型(开头带*为必填参数, []内为默认值)
            # contains_value 列表包含值(*list、*value)
            # < 小于(*value1、*value2)
            # <= 小于等于(*value1、*value2)
            # == 等于(*value1、*value2)
            # >= 大于等于(*value1、*value2)
            # > 大于(*value1、*value2)
            # permission 权限(*permission)
            # contains 字符串包含(*string、*value)
            # equals 字符串匹配(*string、*value)
            # && 条件与(*conditionss)
            # || 条件或(*conditionss)
            type: "permission"
            permission: "mutool.example.admin"
        actions:
          - type: "message"
            message: "<#67E8F9>管理员欢迎来到服务器"
