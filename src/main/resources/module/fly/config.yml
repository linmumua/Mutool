# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 飞行模块
#
# 开关
enable: true

# 飞行命令（第一个为主命令，其余为别名）
commands:
  - "fly"

# 限时飞行命令（第一个为主命令，其余为别名）
time_commands:
  - "flytime"

# 飞行强制关闭坠落倒计时(秒)：剩余时间小于等于该值时开始播放标题/音效提醒
fall_time: 5

# 坠落提醒音效（键为剩余秒数）
fall_sounds:
  3:
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 0.25
    pitch: 0.7
  2:
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 0.25
    pitch: 0.8
  1:
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 0.25
    pitch: 0.9
  0:
    sound: "minecraft:entity.generic.explode"
    volume: 0.25
    pitch: 2.0
