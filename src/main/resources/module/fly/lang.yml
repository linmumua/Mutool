# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"
  error: "<#F87171>✖ <gray>操作失败，请稍后再试"
  player_offline: "<#F87171>✖ <gray>该玩家当前不在线"
  player_not_found: "<#F87171>✖ <gray>找不到该玩家"
  enable: "<#6EE7B7>开启"
  disable: "<#F87171>关闭"

commands:
  fly:
    usage: "/{command} [玩家]"
    description: "飞行"
    message: "<gray>玩家 <white>{player} <gray>的飞行模式 <dark_gray>» {change}"
    fall_messages:
      3:
        title: "<#FBBF24>3"
        subtitle: "<gray>飞行即将结束"
        in: 10
        step: 70
        out: 20
      2:
        title: "<#FBBF24>2"
        subtitle: "<gray>飞行即将结束"
        in: 10
        step: 70
        out: 20
      1:
        title: "<#FBBF24>1"
        subtitle: "<gray>飞行即将结束"
        in: 10
        step: 70
        out: 20
      0:
        title: "<#F87171>飞行已结束"
        subtitle: "<gray>正在缓降"
        in: 10
        step: 70
        out: 20
  flytime:
    usage: "/{command} <参数>"
    description: "限时飞行"
    time_format_error: "<#F87171>✖ <gray>时间必须是数字"
    sub_commands:
      help:
        usage: "/{command} help"
        description: "命令帮助"
        message: |-
          <gradient:#5EEAD4:#60A5FA><b>限时飞行</b></gradient> <dark_gray>· <gray>命令帮助
          <dark_gray>────────────────────────
          {help_list}
          <dark_gray>────────────────────────
      set:
        usage: "/{command} set <玩家> <时间>"
        description: "设置玩家的飞行时间"
        message: "<#6EE7B7>✔ <white>{player} <gray>的飞行时间已设为 <#67E8F9>{change}秒"
      add:
        usage: "/{command} add <玩家> <时间>"
        description: "增加玩家的飞行时间"
        message: "<#6EE7B7>✔ <white>{player} <gray>的飞行时间 <#6EE7B7>+{change}秒<gray>，剩余 <#67E8F9>{amount}秒"
      take:
        usage: "/{command} take <玩家> <时间>"
        description: "减少玩家的飞行时间"
        message: "<#6EE7B7>✔ <white>{player} <gray>的飞行时间 <#F87171>-{change}秒<gray>，剩余 <#67E8F9>{amount}秒"
