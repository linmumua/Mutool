# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 切换游戏模式
#
# 开关
enable: true
# 游戏模式（每项为可用别名，全部转为小写后匹配）
gamemode:
  # 生存
  survival:
    - "survival"
    - "生存"
    - "0"
  # 创造
  creative:
    - "creative"
    - "创造"
    - "1"
  # 冒险
  adventure:
    - "adventure"
    - "冒险"
    - "2"
  # 旁观
  spectator:
    - "spectator"
    - "旁观"
    - "3"
# tab 补全（第一个参数）
tabCompleter:
  - "生存"
  - "创造"
  - "冒险"
  - "旁观"
# 命令（第一个为主命令，其余为别名）
commands:
  - "gamemode"
  - "gm"
