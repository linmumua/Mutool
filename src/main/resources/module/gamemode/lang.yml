# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"
  player_offline: "<#F87171>✖ <gray>该玩家当前不在线"

# 游戏模式名称映射
gamemode:
  SURVIVAL: "生存模式"
  ADVENTURE: "冒险模式"
  CREATIVE: "创造模式"
  SPECTATOR: "旁观模式"

commands:
  gamemode:
    usage: "/{command} <游戏模式> [玩家]"
    description: "修改玩家游戏模式"
    no_game_mode: "<#F87171>✖ <gray>不存在游戏模式 <white>{gamemode}"
    message: "<#6EE7B7>✔ <white>{player} <gray>的游戏模式已切换为 <#67E8F9>{gamemode}"
