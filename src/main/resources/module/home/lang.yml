# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"
  database_error: "<#F87171>✖ <gray>数据存储暂时不可用，请稍后再试"
  black_world: "<#F87171>✖ <gray>该世界禁止使用此命令"

commands:
  home:
    usage: "/{command} [家]"
    description: "返回到指定家"
    no_home: "<#F87171>✖ <gray>家 <white>{home} <gray>不存在"
    open_menu_message: "<gray>已打开家列表"
    invalid_name: "<#F87171>✖ <gray>名称无效"
    world_missing: "<#F87171>✖ <gray>家所在世界 <white>{world} <gray>未加载"
    message: "<#6EE7B7>✔ <gray>已传送到家 <white>{home}"
  sethome:
    usage: "/{command} <家>"
    description: "设置家"
    have_home: "<#F87171>✖ <gray>家 <white>{home} <gray>已存在"
    is_max: "<#F87171>✖ <gray>家的数量已达上限 <white>{amount}"
    message: "<#6EE7B7>✔ <gray>已设置家 <white>{home}"
  delhome:
    usage: "/{command} <家>"
    description: "删除家"
    no_home: "<#F87171>✖ <gray>家 <white>{home} <gray>不存在"
    message: "<#6EE7B7>✔ <gray>已删除家 <white>{home}"
