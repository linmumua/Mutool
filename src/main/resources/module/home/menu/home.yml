# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 标题
title: "<#0F766E>家列表"

# 格子
slots:
  - "HHHHHHHHH"
  - "HHHHHHHHH"
  - "HHHHHHHHH"
  - "HHHHHHHHH"
  - "HHHHHHHHH"
  - "PXXXXXXXN"

# 格子字符
keys:
  home: "H"

# 物品
items:
  home:
    by: "Vanilla"
    type: "red_bed"
    name: "<#67E8F9>{name}"
    lore:
      - "<dark_gray>· <gray>服务器 <white>{server}"
      - "<dark_gray>· <gray>世界 <white>{world}"
      - "<dark_gray>· <gray>X <white>{x}"
      - "<dark_gray>· <gray>Y <white>{y}"
      - "<dark_gray>· <gray>Z <white>{z}"
      - "<dark_gray>· <gray>Yaw <white>{yaw}"
      - "<dark_gray>· <gray>Pitch <white>{pitch}"
      - ""
      - "<#67E8F9>» 点击传送"
  X: &X_ITEM
    by: "Vanilla"
    type: "gray_stained_glass_pane"
    name: " "
  P_1: *X_ITEM
  P_2:
    by: "Vanilla"
    type: "red_stained_glass_pane"
    name: "<#67E8F9>« 上一页"
    conditions:
      - type: ">"
        disabled_check: true
        value1: "{page}"
        value2: 1
    actions:
      all:
        - actions:
            - type: "prev_page"
  N_1: *X_ITEM
  N_2:
    by: "Vanilla"
    type: "lime_stained_glass_pane"
    name: "<#67E8F9>下一页 »"
    conditions:
      - type: ">"
        disabled_check: true
        value1: "{max_page}"
        value2: "{page}"
    actions:
      all:
        - actions:
            - type: "next_page"
