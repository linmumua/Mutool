# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"

commands:
  list:
    usage: "/{command}"
    description: "查看在线列表"
    message: |-
      <gradient:#5EEAD4:#60A5FA><b>服务器状态</b></gradient>
      <dark_gray>────────────────────────
      <gray>TPS  <dark_gray>» <white>{tps}
      <gray>内存 <dark_gray>» <white>{memory}<gray>/{max_memory} MB
      <gray>在线 <dark_gray>» <white>{player_count}<gray>/{max_player_count}
      <white>{player_list}
      <dark_gray>────────────────────────
