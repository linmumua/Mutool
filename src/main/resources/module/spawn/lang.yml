# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"

commands:
  spawn:
    usage: "/{command}"
    description: "返回出生点"
    no_spawn: "<#F87171>✖ <gray>世界 <white>{world} <gray>尚未设置出生点"
    world_missing: "<#F87171>✖ <gray>出生点所在世界 <white>{world} <gray>未加载"
    message: "<#6EE7B7>✔ <gray>已回到出生点"
  setspawn:
    usage: "/{command}"
    description: "设置出生点"
    message: "<#6EE7B7>✔ <gray>已将当前位置设为出生点"
