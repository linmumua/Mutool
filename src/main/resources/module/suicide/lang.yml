# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"

commands:
  suicide:
    usage: "/{command}"
    description: "自杀"
    confirm: |-
      <#FBBF24>⚠ <gray>确定要自杀吗？
      <click:run_command:"/suicide confirm"><hover:show_text:"<gray>点击确认"><#F87171>[确认自杀]</hover></click>
    message: "<gray>你结束了自己的生命"
