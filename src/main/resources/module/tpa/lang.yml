# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"
  player_offline: "<#F87171>✖ <gray>该玩家不在线"

commands:
  tpa:
    usage: "/{command} <目标玩家>"
    description: "请求传送至指定玩家"
    message: "<#6EE7B7>✔ <gray>已向 <white>{player} <gray>发送传送请求"
    request_message: |-
      <gradient:#5EEAD4:#60A5FA><b>传送请求</b></gradient>
      <white>{player} <gray>请求传送到你身边
      <click:run_command:"/tpa accept {player}"><hover:show_text:"<gray>接受 <white>{player} <gray>的请求"><#6EE7B7>[接受]</hover></click>  <click:run_command:"/tpa reject {player}"><hover:show_text:"<gray>拒绝 <white>{player} <gray>的请求"><#F87171>[拒绝]</hover></click>
    in_delay: "<#FBBF24>⚠ <gray>传送冷却中，请 <white>{delay}秒 <gray>后再试"
    no_request: "<#F87171>✖ <white>{player} <gray>没有向你发送传送请求"
    send_self: "<#F87171>✖ <gray>不能向自己发送传送请求"
    open_menu_message: "<gray>已打开传送请求列表"
    menu_no_players: "<#F87171>✖ <gray>当前没有可传送的在线玩家"
    accept:
      message: "<#6EE7B7>✔ <gray>已接受 <white>{player} <gray>的传送请求"
      accepted: "<#6EE7B7>✔ <white>{player} <gray>接受了你的传送请求"
    reject:
      message: "<gray>已拒绝 <white>{player} <gray>的传送请求"
      rejected: "<#F87171>✖ <white>{player} <gray>拒绝了你的传送请求"
    delay:
      message: "<#FBBF24>⚠ <gray>发给 <white>{player} <gray>的传送请求已过期"
      time_out: "<#FBBF24>⚠ <white>{player} <gray>的传送请求已过期"
    cross:
      sent: "<#6EE7B7>✔ <gray>已向 <white>{player} <gray>发送跨服传送请求"
      accept_degrade: "<#FBBF24>⚠ <gray>已接受 <white>{player} <gray>的请求，但对方在其它服务器，暂不支持跨服传送"
      accept_notify: "<#FBBF24>⚠ <white>{player} <gray>接受了你的传送请求，但目标在其它服务器，暂不支持跨服传送"
      reject_notify: "<#F87171>✖ <white>{player} <gray>拒绝了你的传送请求"
