# 配置文件版本号(请勿修改)
config_version: "1.0.0"

# 通用消息（原 MumuTools 全局 lang 中本模块用到的文案，内联以保持模块自包含）
global:
  only_player: "<#F87171>✖ <gray>该命令只能由玩家执行"
  no_permission: "<#F87171>✖ <gray>你没有权限这么做"
  usage_error: "<#F87171>✖ <gray>用法错误 <dark_gray>» <#67E8F9>{usage}"
  database_error: "<#F87171>✖ <gray>数据存储暂时不可用，请稍后再试"

commands:
  warp:
    usage: "/{command} <传送点>"
    description: "传送到指定传送点"
    no_warp: "<#F87171>✖ <gray>传送点 <white>{warp} <gray>不存在"
    world_missing: "<#F87171>✖ <gray>传送点所在世界 <white>{world} <gray>未加载"
    message: "<#6EE7B7>✔ <gray>已传送到 <white>{warp}"
  setwarp:
    usage: "/{command} <传送点>"
    description: "设置传送点"
    message: "<#6EE7B7>✔ <gray>已设置传送点 <white>{warp}"
  delwarp:
    usage: "/{command} <传送点>"
    description: "删除传送点"
    no_warp: "<#F87171>✖ <gray>传送点 <white>{warp} <gray>不存在"
    message: "<#6EE7B7>✔ <gray>已删除传送点 <white>{warp}"
