name: Mutool
version: '1.0.0'
api-version: '26.3'
folia-supported: true
main: cn.linmumua.mutool.Mutool
load: STARTUP

authors:
  - linmumua

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  mutool.commands.hat:
    description: 允许使用 /hat 将手中物品戴到头上
    default: true
  mutool.commands.bed:
    description: 允许使用 /bed 回到床位
    default: true
  mutool.commands.suicide:
    description: 允许使用 /suicide 自杀
    default: op
  mutool.commands.knockback:
    description: 允许使用 /knockback 击退玩家
    default: op
  mutool.commands.ip:
    description: 允许使用 /ip 查询玩家 IP
    default: op
  mutool.commands.fastchangetime:
    description: 允许使用 /fastchangetime 调节时间
    default: op
  mutool.commands.fastchangeweather:
    description: 允许使用 /fastchangeweather 调节天气
    default: op
