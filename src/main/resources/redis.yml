# ============================================================
# Mutool —— Redis 跨服消息总线配置
# ============================================================
# 说明：
#   enable: false 时整套跨服功能自动降级为「本地直发」：
#     - 不连接 Redis、不订阅频道、不产生任何网络阻塞；
#     - MessageBus.send() 只在当前服务器本地处理一次，行为与单服完全一致。
#   enable: true 时，消息会额外发布到 Redis，供其它服务器（相同 channel_prefix）
#   订阅并处理；本服发出的消息会带 source 标识，接收端据此去重，避免重复处理。

# 是否启用跨服消息总线（默认关闭）
enable: false

# Redis 服务器地址
host: "127.0.0.1"

# Redis 端口
port: 6379

# Redis 密码（留空表示无密码）
password: ""

# 本服唯一标识（用于消息去重；请保证多台服务器各不相同）
server_name: "server-1"

# 频道前缀（多服必须一致才能互相收到消息）
channel_prefix: "mutool"
